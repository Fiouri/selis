# cargo-deny — supply chain policy. See docs/SPEC.md "Security, privacy, permissions".
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices fail only for crates we
# depend on directly; transitive ones (e.g. unic-*, paste via Tauri) are tracked upstream.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# ISC and OFL-1.1 (fonts) are pre-approved by docs/SPEC.md even if not in the tree yet.
unused-allowed-license = "allow"
# Permissive licenses only. GPL/AGPL/LGPL/SSPL are denied by omission.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # Weak, file-level copyleft; present in Tauri's HTML tooling (cssparser, selectors).
  "MPL-2.0",
  "OFL-1.1",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Forbidden by project policy (docs/SPEC.md): AGPL engine.
  { crate = "mupdf" },
  { crate = "mupdf-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
