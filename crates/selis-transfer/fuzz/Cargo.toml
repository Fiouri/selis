# cargo-fuzz targets for the parsers that take bytes from another device
# (docs/SPEC.md "Security"): `RUSTC_BOOTSTRAP=1 cargo fuzz run <target>` from this folder
# (Linux/macOS; CI job "fuzz"). Not a workspace member (libFuzzer only).
[package]
name = "selis-transfer-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
selis-transfer = { path = ".." }

[[bin]]
name = "ticket"
path = "fuzz_targets/ticket.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[workspace]
