[package]
name = "selis-transfer"
description = "Selis peer-to-peer transfer (iroh)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Transfer protocol (ADR 0010): exact pins, the iroh-* family moves as one Dependabot group.
iroh = "=1.3.0"
iroh-blobs = { version = "=0.103.1", features = ["fs-store"] }
iroh-tickets = "=1.0.0"
iroh-mdns-address-lookup = "=0.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }

[lints]
workspace = true

[dev-dependencies]
anyhow = "1"
n0-future = "0.3"
