[package]
name = "selis-transfer"
description = "Selis peer-to-peer transfer (iroh)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Transfer protocol (ADR 0010): exact pins, the iroh-* family moves as one Dependabot group.
iroh = "=1.3.0"
iroh-blobs = { version = "=0.103.1", features = ["fs-store"] }
iroh-tickets = "=1.0.0"
iroh-mdns-address-lookup = "=0.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
n0-future = "0.3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
getrandom = "0.4"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
# Dev peer logs (`RUST_LOG`).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi"] }
serde_json.workspace = true
anyhow = "1"
tempfile.workspace = true
postcard = { version = "1", default-features = false, features = ["use-std"] }
