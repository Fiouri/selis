[package]
name = "selis-core"
description = "Selis core: library index, versions, atomic file store. No Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# Derives `specta::Type` on public DTOs so the app crate can generate TS bindings.
specta = ["dep:specta", "dep:specta-typescript"]

[dependencies]
# .selispack (ADR 0012): stored ZIP entries only (no codecs), Argon2id, XChaCha20-Poly1305 STREAM.
aead-stream = { version = "=0.6.0", features = ["alloc"] }
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
getrandom = "0.4"
zip = { version = "=9.0.4", default-features = false }
blake3.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1.25"
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
