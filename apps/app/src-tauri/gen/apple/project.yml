name: selis-app
options:
  bundleIdPrefix: com.anywecon.selis
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Selis
      PRODUCT_BUNDLE_IDENTIFIER: com.anywecon.selis
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  selis-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: selis-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: selis-app_iOS/Info.plist
      properties:
        # "Open in" / "Copy to Selis" for PDFs; iOS copies the file into the app
        # (Documents/Inbox) and hands its URL to RunEvent::Opened (src/lib.rs).
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          # .selispack (ADR 0012): "Open in Selis" from Files / Mail.
          - CFBundleTypeName: Selis pack
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.anywecon.selis.selispack]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.anywecon.selis.selispack
            UTTypeDescription: Selis pack
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [selispack]
              public.mime-type: [application/vnd.anywecon.selispack]
        LSSupportsOpeningDocumentsInPlace: false
        # selis://transfer/<ticket> links (a QR code read by the camera app) → RunEvent::Opened.
        CFBundleURLTypes:
          - CFBundleURLName: com.anywecon.selis.transfer
            CFBundleURLSchemes: [selis]
        # Transfer (ADR 0010): mDNS on the local network (iroh's service, iroh-mdns-address-lookup
        # N0_SERVICE_NAME "irohv1"), the camera for the QR code (ADR 0013) and document scan (ADR 0016).
        NSLocalNetworkUsageDescription: Selis finds your other device on this Wi-Fi to send documents directly, only while the Transfer screen is open.
        NSBonjourServices: [_irohv1._udp]
        NSCameraUsageDescription: Selis uses the camera to scan the QR code of a transfer from your other device and to photograph document pages you scan. Pictures stay on this device.
        # The share sheet's "Save Image" (a page saved as PNG/JPEG goes through the Web Share API).
        NSPhotoLibraryAddUsageDescription: Selis adds a page you export as an image to your photos only when you choose Save Image.
        # Export compliance (docs/store/ios-export-compliance.md, owner decision 2026-10-15): our own
        # TLS / AEAD (rustls, RustCrypto, qpdf) is standard but not Apple's, so non-exempt. No France
        # at launch, hence no ITSEncryptionExportComplianceCode yet.
        ITSAppUsesNonExemptEncryption: true
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1000004"
    entitlements:
      path: selis-app_iOS/selis-app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      # iroh (netdev / netwatch) reads network interfaces through SystemConfiguration.
      - sdk: SystemConfiguration.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a