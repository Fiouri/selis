# Transfer on Android (ADR 0010), with the dev peer on the host as the other device.
# Run with PRE_RUN="…/transfer.sh pre" and POST_RUN="…/transfer.sh post" (run.sh):
# PRE_RUN clears the app, checks that a cold start opens no socket, starts the peer
# sending a fixture and opens its selis:// link (cold start, as the camera app
# would). This flow follows the code and the receive into the library, then leaves
# the Transfer screen; POST_RUN checks the received file and that no socket is left.
appId: com.anywecon.selis
androidWebViewHierarchy: devtools
name: Transfer receive from a link
---
- extendedWaitUntil:
    visible:
      id: "transfer-screen"
    timeout: 30000
# The peer confirms the code on its side (--yes); the device shows it meanwhile.
- extendedWaitUntil:
    visible:
      id: "transfer-receive-done"
    timeout: 120000
- assertVisible: "1 document was added to your library."
- tapOn:
    id: "transfer-open-library"
- assertVisible: "greek"
# Leaving the Transfer screen closes the endpoint (checked by POST_RUN).
- tapOn: "Settings"
- assertVisible:
    id: "settings-screen"
