# One sample PDF from Files › On My iPhone/iPad into the library, then back (store-screenshots.yaml).
# iPhone: a full-screen picker with a tab bar (Recents / Shared / Browse), in the hierarchy.
# iPad: a popover whose content is out of process (only its "dismiss popup" region is in the
# hierarchy): its sidebar's "On My iPad", then the file, by position (POINT, from the script:
# the Files grid sorts names in the device language).
appId: com.anywecon.selis
---
- tapOn: ${T_IMPORT}
- extendedWaitUntil:
    visible: "Browse|Recents|dismiss popup"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "dismiss popup"
    commands:
      - tapOn:
          point: 23%, 46%
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: ${POINT}
- runFlow:
    when:
      visible: "Browse"
    commands:
      - runFlow:
          when:
            notVisible:
              id: ${SAMPLE}
          commands:
            - tapOn: "Browse"
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                text: "On My iPhone"
                optional: true
      # The grid animates in; a tap during the transition selects nothing.
      - extendedWaitUntil:
          visible:
            id: ${SAMPLE}
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: ${SAMPLE}
      - waitForAnimationToEnd:
          timeout: 3000
      # Still in the picker (a tap that did not take): again, a few times.
      - repeat:
          while:
            visible: "On My iPhone"
          times: 4
          commands:
            - tapOn:
                id: ${SAMPLE}
                retryTapIfNoChange: true
            - waitForAnimationToEnd:
                timeout: 3000
- extendedWaitUntil:
    visible: ${PAGE}
    timeout: 30000
- tapOn: ${T_BACK}
