# One sample PDF from Files › On My iPhone/iPad into the library, then back (store-screenshots.yaml).
appId: com.anywecon.selis
---
- tapOn: ${T_IMPORT}
- tapOn:
    text: "Browse"
    optional: true
- tapOn:
    text: "On My iPhone|On My iPad"
    optional: true
# The grid animates in; a tap during the transition selects nothing.
- extendedWaitUntil:
    visible: ${SAMPLE}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ${SAMPLE}
- runFlow:
    when:
      visible: "On My iPhone|On My iPad"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: ${SAMPLE}
- extendedWaitUntil:
    visible: ${PAGE}
    timeout: 30000
- tapOn: ${T_BACK}
