# One sample PDF from Files › On My iPhone/iPad into the library, then back (store-screenshots.yaml).
# iPhone: a full-screen picker with a tab bar (Recents / Shared / Browse), in the hierarchy.
# iPad: a popover whose content is out of process (only its "dismiss popup" region is in the
# hierarchy): its sidebar's "On My iPad". Either way the file is tapped on its thumbnail (POINT,
# from the script: the grid sorts names in the device language); a tap on the cell's centre
# lands on its name label and did not open the file.
appId: com.anywecon.selis
---
- tapOn: ${T_IMPORT}
- extendedWaitUntil:
    visible: "Browse|Recents|dismiss popup"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "dismiss popup"
    commands:
      - tapOn:
          point: 23%, 46%
      # The grid is out of process (nothing to wait on): a fixed pause for it to load.
      - extendedWaitUntil:
          visible: "selis-never-shown"
          timeout: 3000
          optional: true
      - tapOn:
          point: ${POINT}
      - repeat:
          while:
            visible: "dismiss popup"
          times: 3
          commands:
            - extendedWaitUntil:
                visible: "selis-never-shown"
                timeout: 3000
                optional: true
            - tapOn:
                point: ${POINT}
- runFlow:
    when:
      visible: "Browse"
    commands:
      - runFlow:
          when:
            notVisible:
              id: ${SAMPLE}
          commands:
            - tapOn: "Browse"
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                text: "On My iPhone"
                optional: true
      # The grid animates in; a tap during the transition selects nothing.
      - extendedWaitUntil:
          visible:
            id: ${SAMPLE}
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: ${POINT}
      - repeat:
          while:
            visible:
              id: ${SAMPLE}
          times: 3
          commands:
            - extendedWaitUntil:
                visible: "selis-never-shown"
                timeout: 3000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: ${SAMPLE}
                commands:
                  - tapOn:
                      point: ${POINT}
- extendedWaitUntil:
    visible: ${PAGE}
    timeout: 30000
- tapOn: ${T_BACK}
