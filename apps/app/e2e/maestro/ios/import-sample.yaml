# One sample PDF from Files › On My iPhone/iPad into the library, then back (store-screenshots.yaml).
appId: com.anywecon.selis
---
- tapOn: ${T_IMPORT}
# The picker opens on Recents or where it was last; Browse → On My iPhone/iPad from anywhere.
- extendedWaitUntil:
    visible: "Browse"
    timeout: 20000
- runFlow:
    when:
      notVisible:
        id: ${SAMPLE}
    commands:
      - tapOn: "Browse"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "On My iPhone|On My iPad"
          optional: true
# The grid animates in; a tap during the transition selects nothing.
- extendedWaitUntil:
    visible:
      id: ${SAMPLE}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: ${SAMPLE}
- runFlow:
    when:
      visible: "On My iPhone|On My iPad"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: ${SAMPLE}
- extendedWaitUntil:
    visible: ${PAGE}
    timeout: 30000
- tapOn: ${T_BACK}
