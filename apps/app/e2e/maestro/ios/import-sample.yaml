# One sample PDF from Files › On My iPhone/iPad into the library, then back (store-screenshots.yaml).
# iPhone: a full-screen picker with a tab bar (Recents / Shared / Browse). iPad: a popover with a
# sidebar that lists "On My iPad" directly. Either opens on Recents or where it was last.
appId: com.anywecon.selis
---
- tapOn: ${T_IMPORT}
- extendedWaitUntil:
    visible: "Browse|On My iPad|Recents|dismiss popup"
    timeout: 20000
# iPad: the picker is a popover whose content is not in the accessibility hierarchy (only its
# "dismiss popup" region is): its sidebar's "On My iPad" by position.
- runFlow:
    when:
      visible: "dismiss popup"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: 23%, 46%
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ipad-picker
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible:
        id: ${SAMPLE}
    commands:
      - runFlow:
          when:
            visible: "On My iPad"
          commands:
            - tapOn: "On My iPad"
      - runFlow:
          when:
            notVisible: "On My iPad"
          commands:
            - tapOn: "Browse"
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                text: "On My iPhone"
                optional: true
# The grid animates in; a tap during the transition selects nothing.
- extendedWaitUntil:
    visible:
      id: ${SAMPLE}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: ${SAMPLE}
- waitForAnimationToEnd:
    timeout: 3000
# Still in the picker (a tap that did not take): again, a few times.
- repeat:
    while:
      visible: "On My iPhone"
    times: 4
    commands:
      - tapOn:
          id: ${SAMPLE}
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: ${PAGE}
    timeout: 30000
- tapOn: ${T_BACK}
