# One page of scan-batch.yaml: "Scan a photo" → the photo picker → photo ${INDEX} (0 = the
# newest) → Adjust corners → Keep → ${COUNT}.
appId: com.anywecon.selis
---
- extendedWaitUntil:
    visible:
      text: "Scan a photo"
      enabled: true
    timeout: 30000
- tapOn: "Scan a photo"
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 20000
- tapOn:
    text: "Photo taken on.*"
    index: ${INDEX}
- extendedWaitUntil:
    visible: "Adjust corners"
    timeout: 60000
- tapOn:
    id: "scan-keep"
- extendedWaitUntil:
    visible: ${COUNT}
    timeout: 60000
