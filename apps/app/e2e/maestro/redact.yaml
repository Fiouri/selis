# Redaction on Android: text tool across one line, whiteout box with new text
# over the next, apply after the confirm dialog, Done → a new version.
# Prerequisite: ./push-fixtures.sh <serial>. Run with ./run.sh and
#   POST_RUN="apps/app/e2e/maestro/redact.sh check"
# (the earlier version is deleted from the sheet: one library file, the version,
# with no /Redact marks left and without the two lines; the original in
# Download/ untouched).
appId: com.anywecon.selis
androidWebViewHierarchy: devtools
name: Redact - text and whiteout, apply, version
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Your library is empty"
    timeout: 20000
- tapOn: "Import PDF"
- tapOn: "greek.pdf"
- extendedWaitUntil:
    visible: "Page 1 of 2"
    timeout: 20000
- tapOn: "More"
- tapOn: "Redact content"
- extendedWaitUntil:
    visible: "Drag across the text to remove."
    timeout: 5000

# Pixel coordinates for 1080×2340 screens, valid on both the reference AVD
# (selis-midrange-api36, 420 dpi: page top 300 px, 1.68 px/pt) and the Galaxy S23
# (480 dpi: page top 294 px, 1.65 px/pt). Lines are 26 pt (≈ 43 px) apart; each
# swipe sits mid-line on both. redact.sh check verifies the line each box lands on.
# Text tool (default) across body line 2 ("Χωρίς λογαριασμό, χωρίς σύννεφο, …").
- swipe:
    start: 130, 550
    end: 760, 550
    duration: 1200
- extendedWaitUntil:
    visible: "Apply (1)"
    timeout: 5000

# Whiteout over line 3 ("Ξεσκεπάζω την ψυχοφθόρα βδελυγμία.") with new text
# (ASCII: adb input has no Unicode).
- tapOn: "Whiteout"
- swipe:
    start: 120, 575
    end: 600, 612
    duration: 1000
# The editor takes the focus as it opens. Type first: with an on-screen keyboard
# (S23) the hierarchy lists the editor's buttons only once the keyboard is gone.
- inputText: "Fixed line"
- hideKeyboard
- extendedWaitUntil:
    visible: "Add"
    timeout: 5000
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Apply (2)"
    timeout: 5000

- tapOn: "Apply (2)"
- extendedWaitUntil:
    visible: "Remove content under 2 marks for good?"
    timeout: 5000
- tapOn: "Remove"
- extendedWaitUntil:
    visible: "Applied 2 marks."
    timeout: 20000
- tapOn: "Done"
- extendedWaitUntil:
    visible: ".*· saved"
    timeout: 15000

# The imported original still has the removed lines: delete the earlier versions.
- extendedWaitUntil:
    visible: "Earlier versions still have it"
    timeout: 10000
- tapOn: "Delete earlier versions"
- extendedWaitUntil:
    visible: "Delete the earlier versions?"
    timeout: 5000
# Maestro's DevTools snapshot does not always carry the confirm button's test id.
- tapOn:
    text: "Delete"
    rightOf:
      id: "redact-earlier-dialog-cancel"
- extendedWaitUntil:
    visible: "Deleted 1 earlier version."
    timeout: 10000
