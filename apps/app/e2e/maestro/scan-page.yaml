# One page of scan.yaml: shutter → Adjust corners → filter ${FILTER} → Keep → ${COUNT}.
appId: com.anywecon.selis
---
- extendedWaitUntil:
    visible:
      text: "Take a photo of the page"
      enabled: true
    timeout: 30000
- tapOn: "Take a photo of the page"
- extendedWaitUntil:
    visible: "Adjust corners"
    timeout: 60000
- tapOn: ${FILTER}
- tapOn:
    id: "scan-keep"
- extendedWaitUntil:
    visible: ${COUNT}
    timeout: 60000
