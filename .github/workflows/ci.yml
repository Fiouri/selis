name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.3.13750724

jobs:
  checks:
    name: Tier 1 (tsc, eslint, vitest, rust, deny) + Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          # qpdf checks the files the engine writes (unit tests, @selis/fixtures/oracle).
          sudo apt-get install -y qpdf

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run fixtures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: cargo fmt --all --check
      - name: Build the frontend (required by tauri::generate_context!)
        run: npm run build:web -w @selis/app
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated IPC bindings are up to date
        run: git diff --exit-code -- apps/app/src/lib/ipc/bindings.ts

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: apps/app
      - name: Playwright mobile smoke (Pixel 7, iPhone 15) + 390×844 visual snapshots; mock IPC
        run: npm run e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          # The snapshot folders include any baseline written on this run (e.g. a new
          # *-linux.png): download and commit it (CONTRIBUTING.md, "Visual snapshots").
          path: |
            apps/app/playwright-report
            apps/app/test-results
            apps/app/e2e/*-snapshots
          if-no-files-found: ignore

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android NDK (the runner image ships the SDK in $ANDROID_HOME)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
      - name: Rust toolchain + Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Local-network permission before targetSdk 37 (ADR 0010)
        run: scripts/check-android-local-network.sh
      - name: Build debug APK
        # ANDROID_HOME comes from the runner image, so it is only visible to the shell.
        run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" npm run tauri -- android build --debug --apk
      # Release safety: the store-like build (release, no cargo features) must not be
      # debuggable, must not enable WebView remote debugging and must not be a
      # `--features measure` build (scripts/check-release-apk.sh).
      - name: Build store-like release APK (arm64, no features, unsigned)
        run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" npm run tauri -- android build --apk --target aarch64
      - name: Release APK has no debugging / measure build
        run: scripts/check-release-apk.sh apps/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
      - uses: actions/upload-artifact@v6
        with:
          name: selis-android-debug-apk
          path: apps/app/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build (no signing)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust toolchain + iOS simulator target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # gen/apple is committed (generated on macOS; it cannot be generated on Windows).
      # Regenerate only if it was deleted on purpose.
      - name: Generate gen/apple if missing
        working-directory: apps/app
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
            npx tauri ios init --ci
          fi
      # The Xcode "Build Rust Code" phase talks back to the Tauri CLI, so build through it.
      - name: Build for the iOS simulator (debug, no signing)
        run: npm run tauri -- ios build --target aarch64-sim --debug

  windows:
    name: Windows compile check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust toolchain
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri -- build --no-bundle

  fuzz:
    # cargo-fuzz on the parsers that read another device's bytes (tickets, manifests,
    # control messages). libFuzzer needs nightly and does not link on Windows MSVC,
    # so it runs here; `cargo test` covers the same entry points on stable.
    name: Fuzz transfer parsers (60 s each)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: crates/selis-transfer/fuzz
        run: |
          for t in ticket manifest wire; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
