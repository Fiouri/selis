name: iOS screenshots

# App Store screenshots from the iOS simulator (P5b, ADR 0029): a release simulator build of
# Selis driven by Maestro (apps/app/e2e/maestro/ios/), light appearance, a clean status bar,
# the invented sample documents and the scan sample photo. Required sizes, checked 2026-10-15
# (https://developer.apple.com/help/app-store-connect/reference/app-information/screenshot-specifications):
#   iPhone 6.9" (Dynamic Island, large): 1320 × 2868 — iPhone 17 Pro Max
#   iPhone 6.3" (Dynamic Island, medium; "At least one screenshot … (medium display)"): 1206 × 2622 — iPhone 17 Pro
#   iPad 13" ("Required if app runs on iPad"): 2064 × 2752 — iPad Pro 13-inch (M5)
# The JPEGs land in the artifact as fastlane/screenshots/<locale>/; they are reviewed and
# committed by hand (no bot commits).

on:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Reuse the simulator app of this earlier run (skips the build)
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/ios-screenshots.yml
      - apps/app/e2e/maestro/ios/**
      - docs/store/scan-sample/**

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MAESTRO_VERSION: 2.11.0

jobs:
  build:
    name: Simulator build (release)
    if: inputs.app_run_id == '' || inputs.app_run_id == null
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust toolchain + iOS simulator target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Release: the store shows what users get (no debug-only switches on the screens).
      - name: Build for the iOS simulator
        run: npm run tauri -- ios build --target aarch64-sim
      - name: Find the app
        run: |
          app="$(find apps/app/src-tauri/gen/apple/build -name '*.app' -type d -path '*iphonesimulator*' | head -1)"
          [ -n "$app" ] || app="$(find apps/app/src-tauri/gen/apple/build -name '*.app' -type d | head -1)"
          [ -n "$app" ] || { echo "no .app built"; find apps/app/src-tauri/gen/apple/build -maxdepth 4; exit 1; }
          echo "built $app"
          # A tarball: artifacts drop the executable bit inside the bundle.
          mkdir -p dist && cp -R "$app" dist/Selis.app && tar -czf dist/selis-sim.tgz -C dist Selis.app
      - uses: actions/upload-artifact@v6
        with:
          name: selis-ios-sim-app
          path: dist/selis-sim.tgz
          if-no-files-found: error

  shots:
    name: Screenshots ${{ matrix.device.slug }} (${{ matrix.lang }})
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lang: [en, el]
        device:
          - { slug: iphone-6.9, type: "^iPhone 17 Pro Max$", size: "1320 2868" }
          - { slug: iphone-6.3, type: "^iPhone 17 Pro$", size: "1206 2622" }
          - { slug: ipad-13, type: "^iPad Pro 13-inch \\(M5\\)", size: "2064 2752" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: selis-ios-sim-app
          path: dist
          run-id: ${{ inputs.app_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: tar -xzf dist/selis-sim.tgz -C dist
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Device types available
        run: xcrun simctl list devicetypes | grep -E "iPhone 17|iPad Pro" || true
      - name: Screenshots
        run: bash apps/app/e2e/maestro/ios/store-screenshots.sh dist/Selis.app "${{ matrix.device.type }}" "${{ matrix.device.slug }}" "${{ matrix.lang }}"
      - name: Sizes
        run: |
          locale="${{ matrix.lang == 'el' && 'el' || 'en-US' }}"
          want="${{ matrix.device.size }}"
          for f in fastlane/screenshots/$locale/${{ matrix.device.slug }}-*.jpg; do
            got="$(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ { printf "%s ", $2 }' | sed 's/ $//')"
            [ "$got" = "$want" ] || { echo "::error::$f is $got, App Store wants $want"; exit 1; }
          done
          echo "all $want"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-screenshots-${{ matrix.device.slug }}-${{ matrix.lang }}
          path: |
            fastlane/screenshots
            .tmp/ios-shots
          if-no-files-found: warn
          # Maestro's takeScreenshot files live under .maestro/ in the debug output.
          include-hidden-files: true
