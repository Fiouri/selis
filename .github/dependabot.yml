version: 2
# jni stays pinned to wry's version (Tauri hands us wry's JNIEnv); Android/Gradle majors follow the
# Tauri CLI templates, so they are upgraded with Tauri, not by Dependabot.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; Node is pinned to 22 (.nvmrc).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tauri moves as one line (CLI, JS, plugins, crates) — upgrade deliberately (ADR 0001).
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # EmbedPDF v3 is not production-ready (ADR 0002).
      - dependency-name: "@embedpdf/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The transfer stack is pinned exactly and moves as one (ADR 0010).
      iroh:
        patterns: ["iroh", "iroh-*"]
      cargo-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["iroh", "iroh-*"]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "jni"
      # libc 0.2.190 limits in6_ifreq to macOS and breaks netdev (iroh) on iOS; stay on
      # 0.2.189 until netdev or libc fixes it (PR #34).
      - dependency-name: "libc"
        versions: [">= 0.2.190, < 0.3"]
      # Dependabot's lock for serde_json 1.0.154 + uuid 1.28.0 (PR #59) moved bindgen to syn 2
      # while prettyplease 0.3 needs syn 3: bindgen (qpdf-sys) no longer compiled. Taken by hand
      # with `cargo update` after v1.0.
      - dependency-name: "serde_json"
        versions: [">= 1.0.152, < 2"]
      - dependency-name: "uuid"
        versions: [">= 1.28.0, < 2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/app/src-tauri/gen/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # appcompat 1.8.0 brings Kotlin 2.1 metadata, which the Tauri template's Kotlin Gradle plugin
      # 1.9.25 cannot read (PR #16, with Material 1.14.0). Taken with the Tauri line that moves to
      # Kotlin 2.x.
      - dependency-name: "androidx.appcompat:appcompat"
        versions: [">= 1.8.0"]
      - dependency-name: "com.google.android.material:material"
        versions: [">= 1.14.0"]
      # Toolchain frozen for reproducible signed builds until v1.0 ships (PR #57: 8.14.3 → 8.14.6
      # deferred). Remove after the v1.0.0 release.
      - dependency-name: "gradle-wrapper"
