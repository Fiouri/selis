version: 2
# jni stays pinned to wry's version (Tauri hands us wry's JNIEnv); Android/Gradle majors follow the
# Tauri CLI templates, so they are upgraded with Tauri, not by Dependabot.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; Node is pinned to 22 (.nvmrc).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tauri moves as one line (CLI, JS, plugins, crates) — upgrade deliberately (ADR 0001).
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # EmbedPDF v3 is not production-ready (ADR 0002).
      - dependency-name: "@embedpdf/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "jni"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/app/src-tauri/gen/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
