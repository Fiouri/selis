      - export NDK_HOME=$$NDK$$
      - . scripts/reproducible-env.sh
      - npm run tauri -- android build --apk --split-per-abi --target x86_64
    ndk: 27.3.13750724

AutoUpdateMode: Version
# Release tags only (vX.Y.Z); release candidates (vX.Y.Z-rc.N) are skipped.
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
# tauri.conf.json carries the AAB/universal code (…0); each ABI build adds its digit (ADR 0020).
VercodeOperation:
  - '%c + 1'
  - '%c + 2'
  - '%c + 3'
UpdateCheckData: apps/app/src-tauri/tauri.conf.json|"versionCode":\s*(\d+)|.|"version":\s*"([0-9.]+)"
CurrentVersion: 1.0.0
CurrentVersionCode: 10000993
