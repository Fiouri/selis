[workspace]
resolver = "3"
members = ["crates/selis-core", "crates/selis-pdfops", "crates/selis-scan", "crates/selis-transfer", "apps/app/src-tauri"]
exclude = ["crates/selis-transfer/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Fiouri/selis"
authors = ["Any WeCon"]

[workspace.dependencies]
selis-core = { path = "crates/selis-core" }
selis-pdfops = { path = "crates/selis-pdfops" }
blake3 = "1.8.7"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Dev-only builds of the selis-transfer examples run as plain Android binaries
# (no Android context): iroh's DNS resolver reads the system config through JNI
# there and recovers from the failure with catch_unwind, which needs unwinding.
[profile.devtool]
inherits = "release"
panic = "unwind"

# Argon2id (64 MiB) and BLAKE3 are slow unoptimized: keep tests and debug builds usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

# The scan module (WebAssembly, ADR 0016): speed over size.
[profile.wasm]
inherits = "release"
opt-level = 3

# The scan tests straighten real-size photos: keep them quick unoptimized.
[profile.dev.package.imageproc]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.selis-scan]
opt-level = 3
